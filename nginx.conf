# Cấu hình Nginx cho tên miền: khaosat.phuongtungthien.vn
# Đặt file này tại: /etc/nginx/sites-available/khaosat.phuongtungthien.vn
# Sau đó tạo symlink: sudo ln -s /etc/nginx/sites-available/khaosat.phuongtungthien.vn /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name khaosat.phuongtungthien.vn;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khaosat.phuongtungthien.vn;

    # Cấu hình SSL (Tự động tạo bởi Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/khaosat.phuongtungthien.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/khaosat.phuongtungthien.vn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Dung lượng tối đa request (cho upload PDF hoặc dữ liệu lớn)
    client_max_body_size 20M;

    # Gzip nén dữ liệu giúp tải trang siêu nhanh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy toàn bộ request về Node.js Backend (chạy trên port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các tác vụ sinh PDF (tối đa 60 giây)
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cấu hình cache cho tài nguyên tĩnh
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
